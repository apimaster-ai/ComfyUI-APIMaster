# Publishes to the Comfy Registry when a version tag is pushed:  git tag v0.1.0 && git push --tags
# Needs one repository secret: REGISTRY_ACCESS_TOKEN (create it at registry.comfy.org).
#
# Deliberately tag-triggered, not "pyproject.toml changed on main": the very first push of
# the repository adds pyproject.toml, which would fire a publish before the secret exists.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - name: Tag must match pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          [ "$tag" = "$ver" ] || { echo "tag v$tag != pyproject $ver"; exit 1; }
      - uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
